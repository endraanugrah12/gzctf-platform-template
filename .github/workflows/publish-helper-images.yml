name: Publish platform helper images

on:
  push:
    branches: [main]
    paths:
      - wireguard/**
      - ssh-jump/**
      - k8s/challenge-proxy/**
      - .github/workflows/publish-helper-images.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: wireguard
            image: gzctf-wireguard
          - context: ssh-jump
            image: gzctf-ssh-jump
          - context: k8s/challenge-proxy
            image: gzctf-k8s-challenge-proxy
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
