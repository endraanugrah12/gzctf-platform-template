# Cloudflare DNS credentials used by Traefik's ACME DNS-01 resolver. The token
# needs Zone:DNS:Edit and Zone:Zone:Read for the relevant zone.
apiVersion: v1
kind: Secret
metadata:
  name: traefik-cloudflare-dns
  namespace: kube-system
type: Opaque
stringData:
  api-token: "CHANGE_ME_CLOUDFLARE_DNS_API_TOKEN"

---
# Static ACME configuration for the Traefik instance packaged with k3s. DNS-01
# is required to issue the wildcard challenge certificate in 50-ingress.yaml.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.cloudflare.acme.email=CHANGE_ME_ACME_EMAIL"
      - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=15"
    env:
      - name: CF_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: traefik-cloudflare-dns
            key: api-token
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: local-path
      path: /data
    deployment:
      initContainers:
        - name: volume-permissions
          image: busybox:1.37
          command: [sh, -c, "touch /data/acme.json && chmod 600 /data/acme.json"]
          volumeMounts:
            - { name: data, mountPath: /data }
    nodeSelector:
      kubernetes.io/hostname: gzctf-control
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule
    podSecurityContext:
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
