# Static ACME configuration for the Traefik instance packaged with k3s.
# The Ingress annotation in 50-ingress.yaml references this resolver by name.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=CHANGE_ME_ACME_EMAIL"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: local-path
      path: /data
    deployment:
      initContainers:
        - name: volume-permissions
          image: busybox:1.37
          command: [sh, -c, "touch /data/acme.json && chmod 600 /data/acme.json"]
          volumeMounts:
            - { name: data, mountPath: /data }
    podSecurityContext:
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
