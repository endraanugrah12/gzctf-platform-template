# gzctf platform — pulls the custom image published by this project.
# Uses an init container to substitute the postgres password into
# appsettings.json (mounted from the ConfigMap, can't templatize at
# rest without a third-party tool). The result lands on an emptyDir
# read by the main container.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gzctf-files
  namespace: gzctf
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wg-config
  namespace: gzctf
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gzctf
  namespace: gzctf
spec:
  replicas: 1
  strategy:
    type: Recreate     # single-process app; in-memory state not shared
  selector: { matchLabels: { app: gzctf } }
  template:
    metadata: { labels: { app: gzctf } }
    spec:
      serviceAccountName: gzctf
      nodeSelector:
        kubernetes.io/hostname: gzctf-control
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        # Inline secrets (postgres-password, xor-key) into the
        # appsettings.json placeholders. The gzctf container would
        # otherwise see __POSTGRES_PASSWORD__ / __XOR_KEY__ literally
        # and fail to connect / encrypt.
        - name: render-config
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              sed \
                -e "s|__POSTGRES_PASSWORD__|$POSTGRES_PASSWORD|g" \
                -e "s|__XOR_KEY__|$XOR_KEY|g" \
                -e "s|__AD_SSH_INTERNAL_SECRET__|$AD_SSH_INTERNAL_SECRET|g" \
                /tmpl/appsettings.json > /rendered/appsettings.json
              chmod 600 /rendered/appsettings.json
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gzctf-secrets
                  key: postgres-password
            - name: XOR_KEY
              valueFrom:
                secretKeyRef:
                  name: gzctf-secrets
                  key: xor-key
            - name: AD_SSH_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: gzctf-secrets
                  key: ad-ssh-internal-secret
          volumeMounts:
            - { name: appsettings-tmpl, mountPath: /tmpl }
            - { name: appsettings-rendered, mountPath: /rendered }
      containers:
        - name: gzctf
          image: ghcr.io/endraanugrah12/gzctf:evidence-routes
          imagePullPolicy: Always
          ports:
            # Port 8080 is reachable only through the private VPC firewall and
            # is used by A&D flag-writer sidecars on the worker node.
            - { name: http, containerPort: 8080, hostPort: 8080 }
            - { name: honeypot-ssh, containerPort: 2222, hostPort: 2222 }
            - { name: honeypot-mysql, containerPort: 3306, hostPort: 3306 }
            - { name: honeypot-pg, containerPort: 5432, hostPort: 5432 }
            - { name: honeypot-redis, containerPort: 6379, hostPort: 6379 }
            - { name: honeypot-mem, containerPort: 11211, hostPort: 11211 }
            - { name: honeypot-mongo, containerPort: 27017, hostPort: 27017 }
            - { name: honeypot-es, containerPort: 9200, hostPort: 9200 }
          env:
            - name: LC_ALL
              value: en_US.UTF-8
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gzctf-secrets
                  key: admin-password
          volumeMounts:
            - { name: gzctf-files, mountPath: /app/files }
            - { name: wg-config, mountPath: /wg-config }
            - { name: appsettings-rendered, mountPath: /app/appsettings.json, subPath: appsettings.json, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
      volumes:
        - name: gzctf-files
          persistentVolumeClaim:
            claimName: gzctf-files
        - name: appsettings-tmpl
          configMap:
            name: gzctf-appsettings
        - name: appsettings-rendered
          emptyDir: {}
        - name: wg-config
          persistentVolumeClaim:
            claimName: wg-config
---
apiVersion: v1
kind: Service
metadata:
  name: gzctf
  namespace: gzctf
spec:
  selector: { app: gzctf }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
