name: gzctf-monitoring

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  prometheus:
    <<: *service
    image: prom/prometheus:v3.14.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:19090
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 0.5
    cap_drop: [ALL]

  grafana:
    <<: *service
    image: grafana/grafana:13.2.1
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "13000"
      GF_SERVER_ROOT_URL: http://localhost:13000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/system.json
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run make monitoring-init first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]

  node-exporter:
    <<: *service
    image: prom/node-exporter:v1.12.1
    network_mode: host
    pid: host
    command:
      - --web.listen-address=127.0.0.1:19100
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/docker/netns|var/lib/docker/.+)($|/)
    volumes:
      - ${HOST_ROOT:-/}:/host:ro
    mem_limit: 128m
    cpus: 0.25
    cap_drop: [ALL]

  cadvisor:
    <<: *service
    image: ghcr.io/google/cadvisor:v0.60.5
    network_mode: host
    cgroup: host
    # Host visibility is sensitive: this service is for trusted operators only.
    command:
      - --listen_ip=127.0.0.1
      - --port=18080
      - --docker_only=true
      - --containerd=/rootfs${CONTAINERD_SOCKET:-/run/containerd/containerd.sock}
      - --containerd-namespace=moby
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,ChallengeId,TeamId
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,resctrl
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:${DOCKER_DATA_ROOT:-/var/lib/docker}:ro
    mem_limit: 256m
    cpus: 0.5

volumes:
  prometheus-data:
  grafana-data:
