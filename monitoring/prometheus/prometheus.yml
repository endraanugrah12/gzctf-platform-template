global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:19090]
  - job_name: node
    static_configs:
      - targets: [127.0.0.1:19100]
  - job_name: cadvisor
    sample_limit: 100000
    static_configs:
      - targets: [127.0.0.1:18080]
