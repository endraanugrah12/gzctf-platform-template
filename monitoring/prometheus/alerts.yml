groups:
  - name: host-and-exporters
    rules:
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Metrics target {{ $labels.job }} is unavailable'
      - alert: HostHighCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage above 90% for 10 minutes
      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Less than 10% host memory available
      - alert: HostLowDiskSpace
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*"} / node_filesystem_size_bytes < 0.1 and on(instance, device, mountpoint) node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Less than 10% available disk on {{ $labels.mountpoint }}'
      - alert: ContainerNearMemoryLimit
        expr: container_memory_working_set_bytes{name!="",image!=""} / container_spec_memory_limit_bytes > 0.9 and container_spec_memory_limit_bytes > 0 and container_spec_memory_limit_bytes < 1e15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} is near its memory limit'
